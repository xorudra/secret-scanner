    pattern: "(?i)(?:private[_-]?key|eth[_-]?private)\\s*[=:]\\s*['\"]?(0x[a-fA-F0-9]{64})['\"]?"
    severity: "CRITICAL"
    description: "Matches Ethereum/EVM chain private keys (256-bit hex with 0x prefix)."

  - id: bitcoin_wif
    name: "Bitcoin WIF Private Key"
    pattern: "5[HJK][1-9A-HJ-NP-Za-km-z]{49}"
    severity: "CRITICAL"
    description: "Matches Bitcoin Wallet Import Format (WIF) uncompressed private keys."

  # ── Container & Registry ───────────────────────────────────────────────

  - id: ghcr_token
    name: "GitHub Container Registry Token"
    pattern: "ghp_[A-Za-z0-9_]{36,}"
    severity: "HIGH"
    description: "Matches GitHub personal access tokens used for container registry auth."

  - id: docker_config_auth
    name: "Docker Registry Auth"
    pattern: "(?i)\\\"auth\\\":\\s*\\\"([A-Za-z0-9+/=]{20,})\\\""
    severity: "HIGH"
    description: "Matches base64-encoded credentials in Docker config.json auth fields."

  # ── Additional Generic Patterns ────────────────────────────────────────

  - id: env_secret_assignment
    name: "Environment Secret in .env File"
    pattern: "(?i)(?:SECRET|TOKEN|PASSWORD|APIKEY|API_KEY|AUTH|CREDENTIAL|ACCESS_KEY)[A-Z_]*\\s*=\\s*['\"]?([A-Za-z0-9_\\-\\.~+/=]{16,})['\"]?"
    severity: "MEDIUM"
    description: "Matches secret-like variable assignments commonly found in .env files."

  - id: high_entropy_hex_token
    name: "High-Entropy Hex Token"
    pattern: "(?i)(?:token|secret|key|auth|credential|api_key)\\s*[=:]\\s*['\"]?([a-f0-9]{40,})['\"]?"
    severity: "MEDIUM"
    description: "Matches long hex strings assigned to security-sensitive variable names."

  - id: connection_string_generic
    name: "Generic Connection String"
    pattern: "(?i)(?:connection[_-]?string|conn[_-]?str)\\s*[=:]\\s*['\"]([^'\"]{20,})['\"]"
    severity: "HIGH"
    description: "Matches generic connection string assignments that may contain credentials."

  - id: smtp_credentials
    name: "SMTP Credentials"
    pattern: "(?i)(?:smtp[_-]?password|smtp[_-]?pass|mail[_-]?password|email[_-]?password)\\s*[=:]\\s*['\"]?([^'\"\\s]{6,})['\"]?"
