# Default secret detection rules for SecretScanner
rules:

  # ── Cloud Providers ──────────────────────────────────────────────────────

  - id: aws_access_key
    name: "AWS Access Key ID"
    pattern: "AKIA[0-9A-Z]{16}"
    severity: "HIGH"
    description: "Identifies standard AWS IAM user access key identifiers."

  - id: aws_secret_key
    name: "AWS Secret Access Key"
    pattern: "(?i)aws_secret_access_key\\s*[=:]\\s*['\"]?([A-Za-z0-9/+=]{40})['\"]?"
    severity: "HIGH"
    description: "Identifies AWS secret access key assignments."

  - id: gcp_api_key
    name: "Google Cloud / GCP API Key"
    pattern: "AIza[0-9A-Za-z\\-_]{35}"
    severity: "HIGH"
    description: "Matches Google Cloud Platform / Firebase API keys."

  - id: gcp_service_account
    name: "Google Service Account JSON Key"
    pattern: "(?i)\"type\":\\s*\"service_account\""
    severity: "CRITICAL"
    description: "Detects embedded Google service account credential JSON blobs."

  - id: azure_connection_string
    name: "Azure Storage / Service Bus Connection String"
    pattern: "(?i)DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{44,}"
    severity: "CRITICAL"
    description: "Matches Azure Storage or Service Bus connection strings with embedded keys."

  - id: azure_sas_token
    name: "Azure SAS Token"
    pattern: "(?i)(?:sig|sv)=[A-Za-z0-9%+/=]{20,}&?(?:se|st|sp|sr)="
    severity: "HIGH"
    description: "Matches Azure Shared Access Signature tokens."

  # ── Source Control Tokens ─────────────────────────────────────────────────

  - id: github_token
    name: "GitHub Personal Access Token"
    pattern: "gh[pousr]_[A-Za-z0-9_]{36,}"
    severity: "HIGH"
    description: "Matches classic GitHub personal access, OAuth, user, and refresh tokens."

  - id: github_fine_grained
    name: "GitHub Fine-Grained Token"
    pattern: "github_pat_[0-9a-zA-Z_]{82}"
    severity: "HIGH"
    description: "Matches GitHub fine-grained personal access tokens."

  - id: gitlab_token
    name: "GitLab Personal Access Token"
    pattern: "glpat-[0-9a-zA-Z_\\-]{20,}"
    severity: "HIGH"
    description: "Matches GitLab personal access tokens."

  # ── Messaging & Collaboration ─────────────────────────────────────────────

  - id: slack_token
    name: "Slack API Token"
    pattern: "xox[baprs]-[0-9A-Za-z\\-]{10,}"
    severity: "HIGH"
    description: "Matches Slack bot, app, and user authentication tokens."

  - id: slack_webhook
    name: "Slack Webhook URL"
    pattern: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
    severity: "HIGH"
    description: "Matches Slack incoming webhook URLs which allow posting messages to channels."

  - id: discord_token
    name: "Discord Bot Token"
    pattern: "[MN][A-Za-z\\d]{23}\\.[\\w-]{6}\\.[\\w-]{27}"
    severity: "HIGH"
    description: "Matches Discord bot authentication tokens."

  - id: telegram_bot_token
    name: "Telegram Bot API Token"
    pattern: "\\d{8,10}:[A-Za-z0-9_-]{35}"
    severity: "HIGH"
    description: "Matches Telegram Bot API tokens."

  # ── Payment Processors ────────────────────────────────────────────────────

  - id: stripe_key
    name: "Stripe API Key"
    pattern: "(?:sk|rk)_(?:live|test)_[0-9a-zA-Z]{24,}"
    severity: "HIGH"
    description: "Matches Stripe live and test secret/restricted API keys."

  - id: paypal_client_secret
    name: "PayPal Client Secret"
    pattern: "(?i)paypal[_-]?(?:client[_-]?secret|secret[_-]?key)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{30,})['\"]?"
    severity: "HIGH"
    description: "Matches PayPal client secret variable assignments."

  # ── Communication APIs ────────────────────────────────────────────────────

  - id: twilio_auth_token
    name: "Twilio Auth Token"
    pattern: "(?i)(?:twilio[_-]?)?auth[_-]?token\\s*[=:]\\s*['\"]?([a-f0-9]{32})['\"]?"
    severity: "HIGH"
    description: "Matches Twilio account authentication tokens."

  - id: twilio_account_sid
    name: "Twilio Account SID"
    pattern: "AC[a-f0-9]{32}"
    severity: "MEDIUM"
    description: "Matches Twilio account SIDs (used with auth token)."

  - id: sendgrid_key
    name: "SendGrid API Key"
    pattern: "SG\\.[A-Za-z0-9\\-_]{22,}\\.[A-Za-z0-9\\-_]{43,}"
    severity: "HIGH"
    description: "Matches SendGrid API keys."

  - id: mailgun_key
    name: "Mailgun API Key"
    pattern: "key-[0-9a-zA-Z]{32}"
    severity: "HIGH"
    description: "Matches Mailgun private API keys."

  # ── AI / ML Services ─────────────────────────────────────────────────────

  - id: openai_api_key
    name: "OpenAI API Key"
    pattern: "sk-(?:proj-)?[A-Za-z0-9\\-_]{32,}"
    severity: "HIGH"
    description: "Matches OpenAI API secret keys."

  - id: anthropic_key
    name: "Anthropic / Claude API Key"
    pattern: "sk-ant-[A-Za-z0-9\\-_]{95,}"
    severity: "HIGH"
    description: "Matches Anthropic Claude API keys."

  - id: huggingface_token
    name: "HuggingFace API Token"
    pattern: "hf_[A-Za-z0-9]{34,}"
    severity: "HIGH"
    description: "Matches HuggingFace user access tokens."

  - id: cohere_api_key
    name: "Cohere API Key"
    pattern: "[a-zA-Z0-9]{32,}-[a-zA-Z0-9]{16,}"
    severity: "HIGH"
    description: "Matches Cohere API keys."

  - id: replicate_api_token
    name: "Replicate API Token"
    pattern: "r8_[A-Za-z0-9]{32,}"
    severity: "HIGH"
    description: "Matches Replicate API tokens."

  - id: pinecone_api_key
    name: "Pinecone API Key"
    pattern: "[a-zA-Z0-9]{32,}-[a-zA-Z0-9]{10,}"
    severity: "HIGH"
    description: "Matches Pinecone vector database API keys."

  # ── Infrastructure & DevOps ───────────────────────────────────────────────

  - id: cloudflare_token
    name: "Cloudflare API Token"
    pattern: "(?i)cloudflare[_-]?(?:api[_-]?)?token\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-]{40,})['\"]?"
    severity: "HIGH"
    description: "Matches Cloudflare API tokens."

  - id: npm_token
    name: "npm Access Token"
    pattern: "(?:npm_|//registry\\.npmjs\\.org/:_authToken=)[A-Za-z0-9]{36,}"
    severity: "HIGH"
    description: "Matches npm publish/read tokens used in .npmrc and CI configs."

  - id: doppler_token
    name: "Doppler Service Token"
    pattern: "dp\\.st\\.[A-Za-z0-9]{40,}"
    severity: "HIGH"
    description: "Matches Doppler service tokens for secrets management."

  - id: vercel_token
    name: "Vercel Access Token"
    pattern: "[a-zA-Z0-9]{20,}_[a-zA-Z0-9]{20,}"
    severity: "HIGH"
    description: "Matches Vercel access tokens."

  - id: netlify_token
    name: "Netlify Auth Token"
    pattern: "nfp_[A-Za-z0-9]{32,}"
    severity: "HIGH"
    description: "Matches Netlify personal access tokens."

  - id: railway_token
    name: "Railway API Token"
    pattern: "railway_[a-zA-Z0-9]{32,}"
    severity: "HIGH"
    description: "Matches Railway API tokens."

  - id: render_token
    name: "Render API Key"
    pattern: "rnd_[a-zA-Z0-9]{32,}"
    severity: "HIGH"
    description: "Matches Render API keys."

  - id: flyio_token
    name: "Fly.io API Token"
    pattern: "fly_[a-zA-Z0-9]{32,}"
    severity: "HIGH"
    description: "Matches Fly.io API tokens."

  - id: digitalocean_token
    name: "DigitalOcean API Token"
    pattern: "dop_v1_[a-zA-Z0-9]{48,}"
    severity: "HIGH"
    description: "Matches DigitalOcean personal access tokens."

  - id: linode_token
    name: "Linode API Token"
    pattern: "[a-f0-9]{64}"
    severity: "HIGH"
    description: "Matches Linode API tokens."

  - id: heroku_api_key
    name: "Heroku API Key"
    pattern: "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
    severity: "HIGH"
    description: "Matches Heroku API keys (UUID format)."

  - id: atlas_api_key
    name: "MongoDB Atlas API Key"
    pattern: "atlas_[a-zA-Z0-9]{32,}"
    severity: "HIGH"
    description: "Matches MongoDB Atlas API keys."

  - id: snowflake_private_key
    name: "Snowflake Private Key"
    pattern: "-----BEGIN (?:RSA |EC )?PRIVATE KEY-----\\s*Proc-Type: 4,ENCRYPTED"
    severity: "CRITICAL"
    description: "Matches Snowflake encrypted private keys."

  - id: databricks_token
    name: "Databricks Access Token"
    pattern: "dapi[a-f0-9]{16,}"
    severity: "HIGH"
    description: "Matches Databricks personal access tokens."

  - id: kubernetes_config
    name: "Kubernetes Config with Credentials"
    pattern: "(?i)(?:client-certificate-data|client-key-data|token):\\s*[A-Za-z0-9+/=]{20,}"
    severity: "HIGH"
    description: "Matches Kubernetes config files with embedded credentials."

  - id: terraform_token
    name: "Terraform Cloud/Enterprise Token"
    pattern: "tfp_[a-zA-Z0-9]{32,}"
    severity: "HIGH"
    description: "Matches Terraform Cloud API tokens."

  - id: vault_token
    name: "HashiCorp Vault Token"
    pattern: "\\b(?:hvs\\.[A-Za-z0-9_-]{24,}|hvb\\.[A-Za-z0-9_-]{24,}|hvr\\.[A-Za-z0-9_-]{24,}|s\\.[A-Za-z0-9]{24,32})\\b"
    severity: "HIGH"
    description: "Matches HashiCorp Vault tokens (service, batch, recovery, and legacy root)."

  - id: private_key
    name: "RSA/OPENSSH/EC Private Key"
    pattern: "-----BEGIN (?:RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----"
    severity: "CRITICAL"
    description: "Matches unencrypted cryptographic private keys."

  - id: ssh_private_key_body
    name: "PEM Private Key Body"
    pattern: "-----BEGIN CERTIFICATE-----"
    severity: "MEDIUM"
    description: "Matches embedded TLS/SSL certificates (may contain private material)."

  - id: ssh_rsa_private_key
    name: "SSH RSA Private Key"
    pattern: "-----BEGIN OPENSSH PRIVATE KEY-----"
    severity: "CRITICAL"
    description: "Matches OpenSSH private key format."

  - id: pgp_private_key
    name: "PGP Private Key"
    pattern: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    severity: "CRITICAL"
    description: "Matches PGP/GPG private key blocks."

  # ── Generic Patterns ──────────────────────────────────────────────────────

  - id: generic_api_key
    name: "Generic API Key"
    pattern: "(?i)(?:api[_-]?key|apikey)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~]{16,})['\"]?"
    severity: "MEDIUM"
    description: "Matches generic API key variable assignments."

  - id: generic_secret
    name: "Generic Secret Key"
    pattern: "(?i)(?:secret[_-]?key|client[_-]?secret)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~]{16,})['\"]?"
    severity: "MEDIUM"
    description: "Matches secret key or client secret variable assignments."

  - id: password_assignment
    name: "Hardcoded Password"
    pattern: "(?i)(?:password|passwd|pwd)\\s*[=:]\\s*['\"]([^'\"\\s]{8,})['\"]"
    severity: "MEDIUM"
    description: "Matches explicit hardcoded password assignments in quotes."

  - id: database_url
    name: "Database Connection String"
    pattern: "(?i)(?:postgres|postgresql|mysql|mongodb(?:\\+srv)?|redis|mssql|sqlserver):\\/\\/\\S+:\\S+@\\S+"
    severity: "HIGH"
    description: "Matches database connection URIs containing embedded credentials."

  - id: jwt_token
    name: "JSON Web Token (JWT)"
    pattern: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
    severity: "MEDIUM"
    description: "Matches raw JSON Web Tokens."

  - id: bearer_token
    name: "Bearer Authorization Token"
    pattern: "(?i)Authorization:\\s*Bearer\\s+([A-Za-z0-9\\-_\\.~+/]{20,})"
    severity: "MEDIUM"
    description: "Matches hardcoded Bearer Authorization header values."

  - id: basic_auth
    name: "Basic Auth Credentials"
    pattern: "(?i)Authorization:\\s*Basic\\s+[A-Za-z0-9+/=]{20,}"
    severity: "HIGH"
    description: "Matches hardcoded Basic Authorization header values."

  - id: oauth_client_secret
    name: "OAuth Client Secret"
    pattern: "(?i)(?:client[_-]?secret|oauth[_-]?secret)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~]{16,})['\"]?"
    severity: "HIGH"
    description: "Matches OAuth client secret variable assignments."

  - id: webhook_secret
    name: "Webhook Secret/Signing Key"
    pattern: "(?i)(?:webhook[_-]?(?:secret|key|signing[_-]?key)|signing[_-]?secret)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~]{16,})['\"]?"
    severity: "HIGH"
    description: "Matches webhook signing secrets."

  - id: encryption_key
    name: "Encryption/Decryption Key"
    pattern: "(?i)(?:encryption[_-]?key|decryption[_-]?key|cipher[_-]?key|aes[_-]?key)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~+/=]{16,})['\"]?"
    severity: "HIGH"
    description: "Matches encryption key variable assignments."

  - id: ssh_password
    name: "SSH Password in Config"
    pattern: "(?i)(?:ssh[_-]?password|sshpass)\\s*[=:]\\s*['\"]?([^'\"\\s]{4,})['\"]?"
    severity: "HIGH"
    description: "Matches SSH password assignments."

  - id: redis_password
    name: "Redis Password"
    pattern: "(?i)(?:redis[_-]?password|redis[_-]?auth)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~]{8,})['\"]?"
    severity: "HIGH"
    description: "Matches Redis password/auth variable assignments."

  - id: elasticsearch_password
    name: "Elasticsearch Password"
    pattern: "(?i)(?:elasticsearch[_-]?password|es[_-]?password)\\s*[=:]\\s*['\"]?([A-Za-z0-9_\\-\\.~]{8,})['\"]?"
    severity: "HIGH"
    description: "Matches Elasticsearch password assignments."

  # ── Additional Cloud & SaaS Services ────────────────────────────────────

  - id: supabase_key
    name: "Supabase API Key"
    pattern: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.[A-Za-z0-9_-]{30,}\\.[A-Za-z0-9_-]{20,}"
    severity: "HIGH"
    description: "Matches Supabase anon/service role JWT keys."

  - id: supabase_service_role
    name: "Supabase Service Role Key"
    pattern: "(?i)(?:supabase[_-]?service[_-]?role|SUPABASE_SERVICE_ROLE_KEY)\\s*[=:]\\s*['\"]?(eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+)['\"]?"
    severity: "CRITICAL"
    description: "Matches Supabase service role key assignments which grant admin access."

  - id: firebase_api_key
    name: "Firebase API Key"
    pattern: "(?i)(?:firebase[_-]?api[_-]?key|FIREBASE_API_KEY)\\s*[=:]\\s*['\"]?(AIza[0-9A-Za-z\\-_]{35})['\"]?"
    severity: "HIGH"
    description: "Matches Firebase API key assignments."

  - id: firebase_auth_domain
    name: "Firebase Config with Credentials"
    pattern: "(?i)(?:apiKey|authDomain|databaseURL|storageBucket)\\s*[=:]\\s*['\"]([^'\"\\s]{10,})['\"]"
    severity: "MEDIUM"
    description: "Matches Firebase config object credentials."

  - id: shopify_token
    name: "Shopify Access Token"
    pattern: "shpat_[a-fA-F0-9]{32}"
    severity: "HIGH"
    description: "Matches Shopify Admin API access tokens."

  - id: shopify_shared_secret
    name: "Shopify Shared Secret"
    pattern: "shpss_[a-fA-F0-9]{32}"
    severity: "HIGH"
    description: "Matches Shopify shared secrets."

  - id: shopify_custom_app
    name: "Shopify Custom App Token"
    pattern: "shpca_[a-fA-F0-9]{32}"
    severity: "HIGH"
    description: "Matches Shopify custom app access tokens."

  - id: shopify_private_app
    name: "Shopify Private App Password"
    pattern: "shppa_[a-fA-F0-9]{32}"
    severity: "HIGH"
    description: "Matches Shopify private app passwords."

  - id: dockerhub_token
    name: "Docker Hub Access Token"
    pattern: "dckr_pat_[A-Za-z0-9_-]{27,}"
    severity: "HIGH"
    description: "Matches Docker Hub personal access tokens."

  - id: atlassian_api_token
    name: "Atlassian / Jira API Token"
    pattern: "(?i)(?:atlassian|jira|confluence)[_-]?(?:api[_-]?)?token\\s*[=:]\\s*['\"]?([A-Za-z0-9]{24,})['\"]?"
    severity: "HIGH"
    description: "Matches Atlassian/Jira/Confluence API token assignments."

  - id: bitbucket_app_password
    name: "Bitbucket App Password"
    pattern: "(?i)bitbucket[_-]?(?:app[_-]?)?password\\s*[=:]\\s*['\"]?([A-Za-z0-9]{18,})['\"]?"
    severity: "HIGH"
    description: "Matches Bitbucket App Password assignments."

  - id: datadog_api_key
    name: "Datadog API Key"
    pattern: "(?i)(?:datadog|dd)[_-]?api[_-]?key\\s*[=:]\\s*['\"]?([a-f0-9]{32})['\"]?"
    severity: "HIGH"
    description: "Matches Datadog API key assignments."

  - id: datadog_app_key
    name: "Datadog Application Key"
    pattern: "(?i)(?:datadog|dd)[_-]?app(?:lication)?[_-]?key\\s*[=:]\\s*['\"]?([a-f0-9]{40})['\"]?"
    severity: "HIGH"
    description: "Matches Datadog Application key assignments."

  - id: newrelic_key
    name: "New Relic API Key"
    pattern: "NRAK-[A-Z0-9]{27}"
    severity: "HIGH"
    description: "Matches New Relic API keys."

  - id: newrelic_license
    name: "New Relic License Key"
    pattern: "(?i)new[_-]?relic[_-]?license[_-]?key\\s*[=:]\\s*['\"]?([a-f0-9]{40})['\"]?"
    severity: "HIGH"
    description: "Matches New Relic license key assignments."

  - id: sentry_dsn
    name: "Sentry DSN"
    pattern: "https://[a-f0-9]{32}@(?:o\\d+\\.ingest\\.)?sentry\\.io/\\d+"
    severity: "MEDIUM"
    description: "Matches Sentry DSN connection strings."

  - id: sentry_auth_token
    name: "Sentry Auth Token"
    pattern: "sntrys_[A-Za-z0-9_-]{38,}"
    severity: "HIGH"
    description: "Matches Sentry authentication tokens."

  - id: pagerduty_key
    name: "PagerDuty API Key"
    pattern: "(?i)pagerduty[_-]?(?:api[_-]?)?key\\s*[=:]\\s*['\"]?([A-Za-z0-9+/]{20,})['\"]?"
    severity: "HIGH"
    description: "Matches PagerDuty API key assignments."

  - id: launchdarkly_key
    name: "LaunchDarkly SDK Key"
    pattern: "sdk-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
    severity: "HIGH"
    description: "Matches LaunchDarkly SDK keys."

  - id: airtable_key
    name: "Airtable API Key"
    pattern: "(?:key|pat)[A-Za-z0-9]{14,17}"
    severity: "HIGH"
    description: "Matches Airtable API keys and personal access tokens."

  - id: notion_token
    name: "Notion Integration Token"
    pattern: "(?:ntn_|secret_)[A-Za-z0-9]{40,}"
    severity: "HIGH"
    description: "Matches Notion internal integration tokens."

  - id: algolia_api_key
    name: "Algolia Admin API Key"
    pattern: "(?i)algolia[_-]?(?:admin[_-]?)?(?:api[_-]?)?key\\s*[=:]\\s*['\"]?([a-f0-9]{32})['\"]?"
    severity: "HIGH"
    description: "Matches Algolia admin API key assignments."

  - id: mapbox_token
    name: "Mapbox Access Token"
    pattern: "pk\\.[A-Za-z0-9]{60,}"
    severity: "MEDIUM"
    description: "Matches Mapbox public access tokens."

  - id: mapbox_secret
    name: "Mapbox Secret Token"
    pattern: "sk\\.[A-Za-z0-9]{60,}"
    severity: "HIGH"
    description: "Matches Mapbox secret access tokens."

  - id: circleci_token
    name: "CircleCI API Token"
    pattern: "(?i)circle[_-]?(?:ci[_-]?)?token\\s*[=:]\\s*['\"]?([a-f0-9]{40})['\"]?"
    severity: "HIGH"
    description: "Matches CircleCI personal API token assignments."

  - id: travis_token
    name: "Travis CI Token"
    pattern: "(?i)travis[_-]?(?:ci[_-]?)?token\\s*[=:]\\s*['\"]?([A-Za-z0-9_-]{22,})['\"]?"
    severity: "HIGH"
    description: "Matches Travis CI API token assignments."

  - id: azure_devops_pat
    name: "Azure DevOps PAT"
    pattern: "(?i)(?:azure[_-]?devops|vsts)[_-]?(?:pat|token)\\s*[=:]\\s*['\"]?([A-Za-z0-9]{52,})['\"]?"
    severity: "HIGH"
    description: "Matches Azure DevOps Personal Access Token assignments."

  - id: okta_api_token
    name: "Okta API Token"
    pattern: "(?i)(?:okta[_-]?)?(?:api[_-]?)?token\\s*[=:]\\s*['\"]?(00[A-Za-z0-9_-]{40})['\"]?"
    severity: "HIGH"
    description: "Matches Okta API token assignments (starts with 00)."

  - id: auth0_client_secret
    name: "Auth0 Client Secret"
    pattern: "(?i)auth0[_-]?client[_-]?secret\\s*[=:]\\s*['\"]?([A-Za-z0-9_-]{32,})['\"]?"
    severity: "HIGH"
    description: "Matches Auth0 client secret variable assignments."

  - id: contentful_token
    name: "Contentful Delivery/Management Token"
    pattern: "(?:CFPAT-[A-Za-z0-9_-]{43,})"
    severity: "HIGH"
    description: "Matches Contentful Personal Access Tokens."

  - id: planetscale_token
    name: "PlanetScale API Token"
    pattern: "pscale_tkn_[A-Za-z0-9_-]{32,}"
    severity: "HIGH"
    description: "Matches PlanetScale API tokens."

  - id: planetscale_password
    name: "PlanetScale DB Password"
    pattern: "pscale_pw_[A-Za-z0-9_-]{32,}"
    severity: "CRITICAL"
    description: "Matches PlanetScale database branch passwords."

  - id: neon_api_key
    name: "Neon Database API Key"
    pattern: "neon_[a-z0-9_]{32,}"
    severity: "HIGH"
    description: "Matches Neon serverless Postgres API keys."

  - id: upstash_redis_token
    name: "Upstash Redis Token"
    pattern: "(?i)upstash[_-]?redis[_-]?(?:rest[_-]?)?token\\s*[=:]\\s*['\"]?([A-Za-z0-9=]{30,})['\"]?"
    severity: "HIGH"
    description: "Matches Upstash Redis REST token assignments."

